<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viral Video</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0f14;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 25px 16px;
    }

    h1 {
      font-size: 25px;
      margin-bottom: 8px;
    }

    p {
      color: #aeb7c2;
      margin-bottom: 22px;
    }

    .video-box {
      background: #151b23;
      border-radius: 16px;
      padding: 10px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .video-box iframe {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
      border-radius: 12px;
      display: block;
    }

    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px;
      margin-top: 14px;
      border-radius: 12px;
      color: white;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
    }

    .watch-button {
      background: #1877f2;
    }

    .telegram-button {
      background: #229ED9;
    }

    .telegram-icon {
      width: 22px;
      height: 22px;
      fill: white;
    }

    .note {
      font-size: 12px;
      margin-top: 18px;
      color: #77818d;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🔥 Viral Video</h1>

    <p>Watch the latest trending video</p>

    <div class="video-box">
      <iframe
        src="https://vidlyx.cc/e/9pzp1o4op83"
        scrolling="no"
        allowfullscreen>
      </iframe>
    </div>

    <!-- Telegram Button -->
    <a
      class="button telegram-button"
      href="https://t.me/yourhub15"
      target="_blank"
      rel="noopener noreferrer">

      <svg class="telegram-icon" viewBox="0 0 24 24">
        <path d="M21.5 3.5L18.3 20c-.2 1.1-.9 1.4-1.8.9l-5-3.7-2.4 2.3c-.3.3-.5.5-1 .5l.4-5.1 9.3-8.4c.4-.4-.1-.6-.6-.2L5.7 13.8.8 12.3c-1.1-.3-1.1-1.1.2-1.6L20.2 4.1c.9-.3 1.7.2 1.3-.6z"/>
      </svg>

      Join Telegram Channel
    </a>

    <!-- DiskWala Button -->
    <a
      class="button watch-button"
      href="https://www.diskwala.com/app/6a85c8a206ba7ea03de28574"
      target="_blank"
      rel="noopener noreferrer">
      ▶ Watch / Continue
    </a>

    <div class="note">
      Click the button to continue.
    </div>

  </div>

</body>
</html>
